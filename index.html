<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Aisance: цифры</title>
<style>
  :root{--ink:#1a1f24;--muted:#5d6670;--line:#e2e5e9;--bg:#f5f6f8;--card:#fff;--accent:#1f6f5c;--warn:#8a5a00;--warnbg:#fdf3e0;--bar:#7fa89d;--slot:#fafbfc}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
  .top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
  h1{font-size:15px;margin:0;font-weight:700}
  .ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  label{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
  select,input,button{font:inherit;font-size:13px;color:var(--ink);background:var(--card);border:1px solid #c9ced4;border-radius:6px;padding:4px 7px}
  input#key{width:150px}
  button{cursor:pointer}
  button.pri{background:var(--ink);border-color:var(--ink);color:#fff}
  .tabs{display:flex;gap:2px;overflow-x:auto;padding:8px 16px 0;background:var(--card);border-bottom:1px solid var(--line);scrollbar-width:thin}
  .tab{border:0;background:none;border-bottom:2px solid transparent;border-radius:0;padding:6px 10px;color:var(--muted);white-space:nowrap;font-weight:600}
  .tab.on{color:var(--ink);border-bottom-color:var(--ink)}
  .tabsep{width:1px;background:var(--line);margin:4px 6px;flex:none}
  main{padding:14px 16px 40px;max-width:1240px;margin:0 auto}
  h2{font-size:14px;margin:18px 0 6px;font-weight:700}
  h2:first-child{margin-top:0}
  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:10px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
  .kpi .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
  .kpi .l{font-size:12px;color:var(--ink);margin-top:1px}
  .kpi .s{font-size:11px;color:var(--muted);margin-top:2px}
  .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;align-items:start}
  .two>*{min-width:0}
  .tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:10px}
  table{border-collapse:collapse;width:100%}
  th,td{padding:5px 9px;text-align:left;border-bottom:1px solid var(--line);font-size:12.5px;white-space:nowrap}
  tr:last-child td{border-bottom:0}
  th{color:var(--muted);font-weight:600;background:#fafbfc}
  td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
  td.wrap{white-space:normal;min-width:190px}
  td.b{font-weight:700}
  a,.lnk{color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px;background:none;border:0;padding:0;font:inherit}
  .note{color:var(--muted);font-size:12px;margin:2px 0 10px;max-width:880px}
  .nd{color:var(--muted);font-weight:400;font-style:italic}
  .warnbox{background:var(--warnbg);border:1px solid #edd9b0;border-radius:8px;padding:8px 11px;margin-bottom:10px;font-size:13px;color:#4f3b10}
  .warnbox b{color:var(--warn)}
  .warnbox div+div{margin-top:5px}
  .err{background:#fbecea;border:1px solid #efcdc8;border-radius:8px;padding:8px 11px;margin-bottom:10px;font-size:13px;color:#7b2b22}
  .slot{background:var(--slot);border:1px dashed #aab2bb;border-radius:8px;padding:9px 12px;margin-bottom:10px;font-size:12.5px;color:var(--muted)}
  .slot b{color:var(--ink)}
  .slot ul{margin:4px 0 0;padding-left:18px}
  .empty{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;font-size:13px}
  .tag{display:inline-block;font-size:11px;padding:0 5px;border-radius:4px;background:#eceef1;color:var(--muted);margin-left:4px}
  .tag.w{background:var(--warnbg);color:var(--warn)}
  .chart{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px 6px;margin-bottom:10px}
  .chart .ttl{font-size:12px;color:var(--muted);margin-bottom:5px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .cols{display:flex;align-items:flex-end;gap:1px;height:84px}
  .cols i{display:block;flex:1 1 0;min-width:1px;background:var(--bar);border-radius:1px 1px 0 0}
  .cols i.z{background:var(--line)}
  .axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:3px}
  details>summary{cursor:pointer;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px}
  details>summary .more{color:var(--accent);text-decoration:underline;text-underline-offset:2px;font-size:12px;white-space:nowrap}
  details[open]>summary{font-size:0}
  details[open]>summary .more{font-size:12px}
  details>summary .c,details[open]>summary .o{display:none}
  details[open]>summary .c{display:inline}
  .fbar{display:flex;align-items:center;gap:8px;font-size:12.5px}
  .fbar .track{flex:1;background:#eef0f3;height:12px;border-radius:2px;min-width:60px}
  .fbar .track i{display:block;height:100%;background:var(--bar);border-radius:2px}
  .msgs{display:flex;flex-direction:column;gap:6px}
  .m{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
  .m.user{border-left:3px solid var(--ink)}
  .m.assistant{border-left:3px solid var(--bar)}
  .m .h{font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:3px 9px;margin-bottom:3px}
  .m .t{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px}
  .fil{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
  pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;margin:5px 0;max-height:320px;overflow:auto}
  @media(max-width:600px){
    input#key{width:120px}
    .two{grid-template-columns:minmax(0,1fr)}
    main{padding:12px 12px 32px}
    header{padding:9px 12px}
    .tabs{padding:6px 8px 0}
    .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Aisance: цифры</h1>
    <div class="ctl">
      <label>Сервер <select id="server" aria-label="Сервер"></select></label>
      <input id="key" type="password" placeholder="ключ админки" autocomplete="off" aria-label="Ключ админки">
      <button id="go" class="pri">Открыть</button>
    </div>
    <div class="ctl">
      <label>Период <select id="preset" aria-label="Период">
        <option value="7">7 дней</option><option value="30">30 дней</option><option value="90">90 дней</option><option value="all">Всё время</option><option value="custom">Свои даты</option>
      </select></label>
      <span id="dates" class="ctl" hidden>
        <input type="date" id="dfrom" aria-label="С"> <input type="date" id="dto" aria-label="По">
      </span>
      <label>Кого считать <select id="aud" aria-label="Кого считать">
        <option value="real">Реальные</option><option value="test">Тестовые</option><option value="all">Все</option>
      </select></label>
    </div>
  </div>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="main"><p class="note">Выберите сервер, введите ключ и нажмите «Открыть».</p></main>

<script>
// Ключа в этом файле нет: страница публичная, данные отдаёт функция admin-dashboard по заголовку x-admin-key.
const SERVERS={
  staging:{label:"Staging (тест)",base:"https://oiuzslzcbamraxyluyqj.supabase.co/functions/v1/admin-dashboard",ref:"oiuzslzcbamraxyluyqj"},
  prod:{label:"Прод",base:"https://sdmhghqecsiddiitorgs.supabase.co/functions/v1/admin-dashboard",ref:"sdmhghqecsiddiitorgs"},
};
const TABS=[["summary","Сводка"],["users","Пользователи"],["money","Деньги"],["funnel","Воронка"],["chat","Чат ИИ"],["messages","Сообщения"],["features","Функции"],["health","Здоровье"],["|",""],["log","Журнал"],["spending","Расходы"],["cards","Карточки"],["people","Люди"],["sessions","Сессии"]];
const STATS_TABS=new Set(["summary","users","money","funnel","chat","features","health"]);
const GROUPS=[["user","по людям"],["session","по сессиям"],["device","по устройствам"],["time","по дням"],["kind","по типам"]];

const st={server:"staging",tab:"summary",preset:"30",from:null,to:null,audience:"real",stats:null,group:"user",user:null,session:null,inSession:false,
  msg:{user:null,session:null,role:"all",sort:"newest",minLen:0,source:"all",offset:0,rows:[],data:null}};

const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isNum=(x)=>x!==null&&x!==undefined&&x!==""&&!isNaN(+x);
const n=(x)=>isNum(x)?Number(x).toLocaleString("ru-RU"):ND;
const ND=`<span class="nd">нет данных</span>`;
const usd=(x,d)=>{if(!isNum(x))return ND;const v=+x;const dig=d!=null?d:(Math.abs(v)>=100?0:Math.abs(v)>=1?2:4);return "$"+v.toLocaleString("ru-RU",{minimumFractionDigits:dig,maximumFractionDigits:dig});};
const pct=(a,b)=>(isNum(a)&&+b>0)?Math.round(+a/+b*100)+"%":"";
const bytes=(x)=>{if(!isNum(x))return ND;const v=+x;if(v>=1e9)return (v/1e9).toLocaleString("ru-RU",{maximumFractionDigits:2})+" ГБ";if(v>=1e6)return (v/1e6).toLocaleString("ru-RU",{maximumFractionDigits:1})+" МБ";if(v>=1e3)return Math.round(v/1e3).toLocaleString("ru-RU")+" КБ";return v+" Б";};
const sid=(x)=>x?esc(String(x).slice(0,8)):"-";
const today=()=>new Date().toISOString().slice(0,10);
const shift=(d)=>new Date(Date.now()-d*86400000).toISOString().slice(0,10);
const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};

function windowDates(){
  if(st.preset==="custom"&&st.from&&st.to) return {from:st.from,to:st.to};
  if(st.preset==="all") return {from:"2026-01-01",to:today()};
  const d=parseInt(st.preset,10)||30;
  return {from:shift(d-1),to:today()};
}

async function call(params){
  const key=$("key").value.trim();
  if(!key) throw new Error("Введите ключ админки.");
  const p=new URLSearchParams({format:"json",...params});
  const res=await fetch(SERVERS[st.server].base+"?"+p.toString(),{headers:{"x-admin-key":key},signal:AbortSignal.timeout(45000)});
  const j=await res.json().catch(()=>({error:"bad_response"}));
  if(res.status===401) throw new Error("Ключ не подошёл, либо на этом сервере ещё старая версия функции admin-dashboard.");
  if(res.status===503) throw new Error("На этом сервере не задан ADMIN_DASHBOARD_SECRET.");
  if(!res.ok||j.error) throw new Error("Сервер ответил ошибкой: "+(j.error||res.status));
  return j;
}

// ---------- общие куски ----------
const kpi=(l,v,s)=>`<div class="kpi"><div class="v">${v}</div><div class="l">${esc(l)}</div>${s?`<div class="s">${s}</div>`:""}</div>`;
const tbl=(head,rows)=>`<div class="tw"><table><tr>${head.map(h=>{const r=h.startsWith(">");return `<th${r?' class="r"':""}>${esc(r?h.slice(1):h)}</th>`;}).join("")}</tr>${rows.join("")}</table></div>`;
const tr=(...cells)=>"<tr>"+cells.join("")+"</tr>";
const td=(v,c)=>`<td${c?` class="${c}"`:""}>${v}</td>`;
const R=(v)=>td(v,"r");
const secErr=(s)=>s&&s.error?`<div class="err">Этот раздел не загрузился: ${esc(s.error)}</div>`:"";
const period=()=>{const w=windowDates();return esc(w.from)+" ... "+esc(w.to);};

function dayBars(title,rows,key,fmt){
  const w=windowDates();
  const map=new Map((rows||[]).map(r=>[r.day,+r[key]||0]));
  const first=(rows&&rows.length&&st.preset==="all")?rows[0].day:w.from;
  const out=[];let d=new Date(first+"T00:00:00Z");const end=new Date(w.to+"T00:00:00Z");
  while(d<=end&&out.length<800){const iso=d.toISOString().slice(0,10);out.push([iso,map.get(iso)||0]);d=new Date(+d+86400000);}
  const max=Math.max(0,...out.map(x=>x[1]));
  const f=fmt||((v)=>Number(v).toLocaleString("ru-RU"));
  if(!out.length||max===0) return `<div class="chart"><div class="ttl"><span>${esc(title)}</span></div><span class="nd">за этот период нет данных</span></div>`;
  const sum=out.reduce((a,x)=>a+x[1],0);
  return `<div class="chart"><div class="ttl"><span>${esc(title)}</span><span>всего ${f(sum)}, максимум ${f(max)}</span></div>
    <div class="cols">${out.map(([day,v])=>`<i class="${v?"":"z"}" style="height:${v?Math.max(4,Math.round(v/max*100)):2}%" title="${esc(day)}: ${esc(f(v))}"></i>`).join("")}</div>
    <div class="axis"><span>${esc(out[0][0])}</span><span>${esc(out[out.length-1][0])}</span></div></div>`;
}

const SLOT_MIXPANEL=`<div class="slot"><b>Ждёт данных: Mixpanel</b> (AisanceEU 4039761). Панели нужен серверный ключ, через вход Артёма она читать не может.
  <ul><li>Активные за день, неделю, месяц: <code>v1_app_opened</code></li>
  <li>Интро: <code>v1_intro_step1_continue</code>, <code>v1_intro_step2_continue</code>, <code>v1_intro_step3_get_started</code></li>
  <li>Пейвол: <code>v1_paywall_opened</code>, <code>v1_plan_selected</code>, <code>v1_purchase_completed</code>, <code>v1_purchase_abandoned</code></li>
  <li>Упёрлись в лимит: <code>v1_token_limit_reached</code></li>
  <li>Голос: <code>v1_money_voice_started</code>, <code>v1_money_voice_result</code></li>
  <li>Страны. Только реальные: <code>build_env = production</code>, а у версии 1.5.15 этого свойства нет, там фильтр по <code>$app_version_string</code></li></ul></div>`;
const SLOT_APPSFLYER=`<div class="slot"><b>Ждёт ключа: AppsFlyer.</b> Установки и источники трафика. На сервере этого нет.</div>`;
const SLOT_LOGS=`<div class="slot"><b>Ждёт ключа: логи функций Supabase.</b> Ошибки edge-функций лежат в логах, а не в базе. Функции нужен токен Supabase Management API с правом на чтение логов; его пока нет, поэтому числа здесь нет.</div>`;

function rcBlock(rc){
  if(!rc||rc.status==="no_key") return `<div class="slot"><b>Ждёт ключа: RevenueCat.</b> На сервере не задан REVENUECAT_API_KEY или REVENUECAT_PROJECT_ID.</div>`;
  if(rc.status==="no_access") return `<div class="slot"><b>Ждёт ключа: RevenueCat.</b> Ключ на сервере не имеет доступа к метрикам (ответ ${esc(rc.http)}). Нужен секретный ключ V2 с правами на charts_metrics.</div>`;
  if(rc.status!=="ok") return `<div class="err">RevenueCat сейчас не ответил (${esc(rc.http||rc.detail||"ошибка")}). Обновите страницу позже.</div>`;
  const a=rc.now||{},w=rc.window||{};
  return `<h2>Магазин: RevenueCat, сейчас</h2><div class="kpis">
      ${kpi("Активные подписки",n(a.active_subscriptions),"сейчас, без пробных")}
      ${kpi("Активные пробные",n(a.active_trials),"сейчас")}
      ${kpi("MRR",usd(a.mrr,0),"в месяц")}
      ${kpi("Выручка за 28 дней",usd(a.revenue_28d,0),"последние 28 дней")}
      ${kpi("Новые клиенты",n(a.new_customers_28d),"последние 28 дней")}
      ${kpi("Активные клиенты",n(a.active_users_28d),"последние 28 дней")}
    </div>
    <h2>Магазин: RevenueCat, за период</h2>
    ${w.charts_ok?"":`<div class="note">Часть графиков RevenueCat не ответила: пропуски ниже значат «неизвестно», а не ноль.</div>`}
    <div class="kpis">
      ${kpi("Выручка",usd(w.revenue,0),n(w.transactions)+" транзакций, с продлениями")}
      ${kpi("Пробных начато",n(w.trial_starts))}
      ${kpi("Пробный в оплату",n(w.trial_conversions),isNum(w.trial_starts)&&+w.trial_starts>0?pct(w.trial_conversions,w.trial_starts)+" от начатых":"")}
      ${kpi("Пробных истекло",n(w.trial_expired),isNum(w.trial_pending)?n(w.trial_pending)+" ещё идут":"")}
      ${kpi("Новые платные",n(w.new_paid),isNum(w.resubscribed)?n(w.resubscribed)+" вернулись":"")}
      ${kpi("Потеряли доступ",n(w.churned),"отмены и неуспешные списания вместе")}
      ${kpi("Новые клиенты",n(w.new_customers))}
    </div>
    <p class="note">Проект RevenueCat берётся из секретов сервера и может быть один на все сборки, поэтому на staging здесь могут быть боевые покупки. Отдельного числа продлений в RevenueCat нет: продления входят в транзакции.</p>`;
}

// ---------- разделы ----------
function viewSummary(d){
  const s=d.sections,u=s.users||{},m=s.money||{},c=s.chat||{},f=s.funnel||{},h=s.health||{},t=c.totals||{};
  const a=[];
  if(h.freshness&&h.freshness.chat&&(Date.now()-new Date(h.freshness.chat.replace(" ","T")+":00Z"))>7*86400000) a.push(`<b>Чат молчит:</b> последнее сообщение на сервере ${esc(h.freshness.chat)}.`);
  const rcA=d.rc&&d.rc.status==="ok"?d.rc.now.active_subscriptions:null;
  if(st.server==="prod"&&isNum(rcA)&&isNum(m.paid_now)&&+rcA!==+m.paid_now&&d.audience==="real") a.push(`<b>Подписки расходятся:</b> RevenueCat считает ${n(rcA)} активных, а по таблице user_credits доступ оплачен у ${n(m.paid_now)}. Деньгами считайте RevenueCat, а доступ проверьте.`);
  return (a.length?`<div class="warnbox">${a.map(x=>`<div>${x}</div>`).join("")}</div>`:"")+
    `<div class="kpis">
      ${kpi("Новые пользователи",n(u.new_total),"за период, "+n(u.new_with_account)+" с аккаунтом")}
      ${kpi("Активные",n(u.active&&u.active.any),"за период, нижняя граница")}
      ${kpi("Всего пользователей",n(u.total),n(u.with_account)+" с аккаунтом")}
      ${kpi("Платят сейчас",n(m.paid_now),"по user_credits")}
      ${kpi("Подписки в магазине",d.rc&&d.rc.status==="ok"?n(d.rc.now.active_subscriptions):ND,"RevenueCat, сейчас")}
      ${kpi("MRR",d.rc&&d.rc.status==="ok"?usd(d.rc.now.mrr,0):ND,"RevenueCat")}
      ${kpi("Сообщений в чате",n(t.messages),"за период, "+n(t.users)+" человек")}
      ${kpi("Расход на ИИ",usd(t.cost_usd),"за период")}
    </div>`+
    dayBars("Новые пользователи по дням",u.by_day,"total")+
    dayBars("Сообщения в чате по дням",c.by_day,"messages")+
    SLOT_MIXPANEL;
}

function viewUsers(d){
  const u=d.sections.users; if(u.error) return secErr(u);
  const p=u.plans||{},a=u.active||{};
  const lang=(u.languages||[]);
  const known=lang.filter(l=>l.language);
  return `<div class="kpis">
      ${kpi("Новые",n(u.new_total),"за период")}
      ${kpi("Новые с аккаунтом",n(u.new_with_account),"за период, Apple или почта")}
      ${kpi("Всего",n(u.total),"сейчас")}
      ${kpi("Анонимные",n(u.anonymous),pct(u.anonymous,u.total)+" от всех")}
      ${kpi("С аккаунтом",n(u.with_account),"сейчас")}
    </div>`+
    dayBars("Регистрации по дням (первый запуск создаёт анонимного пользователя)",u.by_day,"total")+
    dayBars("Из них с аккаунтом",u.by_day,"with_account")+
    `<div class="two"><div><h2>Активные за период</h2>`+tbl(["Признак",">Людей"],[
      tr(td("Что-то из списка ниже"),R(n(a.any))),

  if(m.user) chosen.push(`человек ${sid(m.user)}`);

  return `<div class="fil">
    <label>Порядок <select id="msort">${opt("newest","Сначала новые",m.sort)}${opt("longest","Сначала длинные",m.sort)}</select></label>

    <label>Длина <select id="mmin">${opt(0,"Любая",m.minLen)}${opt(500,"от 500 знаков",m.minLen)}${opt(1000,"от 1000 знаков",m.minLen)}${opt(2000,"от 2000 знаков",m.minLen)}${opt(4000,"от 4000 знаков",m.minLen)}</select></label>
    <label>Откуда <select id="msrc">${opt("all","Обе таблицы",m.source)}${opt("llm_io_debug","llm_io_debug",m.source)}${opt("chat_messages","chat_messages",m.source)}</select></label>

}
function msgRow(r){
  const long=r.length>700;
  const body=long
    ?`<details><summary>${esc(String(r.text).slice(0,360))}... <span class="more"><span class="o">показать полностью (${n(r.length)} знаков)</span><span class="c">свернуть</span></span></summary><div class="t">${esc(r.text)}</div></details>`
    :`<div class="t">${esc(r.text)}</div>`;
  const who=r.role==="assistant"?"Ассистент":r.role==="system"?"Система":"Человек";
  return `<div class="m ${esc(r.role)}"><div class="h"><b>${who}</b><span>${esc(r.created_at)}</span><span>${n(r.length)} знаков</span>
    <a data-msguser="${esc(r.user_id)}">человек ${sid(r.user_id)}</a>${r.session_id?`<a data-msgsession="${esc(r.session_id)}">сессия ${sid(r.session_id)}</a>`:""}
    ${r.model?`<span>${esc(String(r.model).replace(/^claude-/,""))}</span>`:""}<span class="tag">${esc(r.source)}</span>
    ${r.anonymous?`<span class="tag">аноним</span>`:""}${r.is_test?`<span class="tag">тест</span>`:""}${r.truncated?`<span class="tag w">обрезано при записи</span>`:""}${r.kind&&r.kind!=="agent"?`<span class="tag">${esc(r.kind)}</span>`:""}</div>${body}</div>`;
}
function viewMessages(){
  const m=st.msg,d=m.data,cap=m.capture||{};
  const mode=(v)=>({off:"выключена",test:"только тестовые",all:"все пользователи"}[v]||"неизвестно");
  const switches=`IO_CAPTURE: ${esc(mode(cap.io_capture))}. TRANSCRIPT_LOGGING: ${esc(mode(cap.transcript_logging))}.`;
  if(+d.stored_chat_messages===0&&+d.stored_io_turns===0){
    return `<div class="empty"><b>На этом сервере пока нет ни одного сохранённого сообщения.</b> Таблицы llm_io_debug и chat_messages пусты. Запись: ${switches}
      <p class="note" style="margin:6px 0 0">Страница заполнится сама, как только люди напишут в чат при включённой записи. Токены и расходы по каждому человеку уже есть на вкладках «Чат ИИ», «Люди» и «Сессии».</p></div>`;
  }
  const idx=d.index||{};
  const users=(idx.users||[]),sess=(idx.sessions||[]);
  return msgFilters()+
    `<p class="note">Найдено ${n(d.total)}, самое длинное ${n(d.longest)} знаков. На сервере: ${n(d.stored_io_turns)} ходов в llm_io_debug, ${n(d.stored_chat_messages)} строк в chat_messages. Запись: ${switches} Период сверху действует, кроме случая, когда открыта одна сессия. Это личная переписка: читаем для улучшения чата и никуда не копируем.</p>`+
    `<h2>Люди</h2>`+(users.length?tbl(["Человек",">От человека",">Всего строк",">Сессий",">Самое длинное","Последнее"],users.map(u=>tr(td(`<a data-msguser="${esc(u.user_id)}">${sid(u.user_id)}</a>`+(u.anonymous?`<span class="tag">аноним</span>`:"")+(u.is_test?`<span class="tag">тест</span>`:"")),R(n(u.from_user)),R(n(u.messages)),R(n(u.sessions)),R(n(u.longest)),td(esc(u.last_at))))):`<div class="empty">За этот период никого.</div>`)+
    (m.user?`<h2>Сессии человека ${sid(m.user)}</h2>`+(sess.length?tbl(["Сессия",">От человека",">Всего строк",">Самое длинное","Начало","Конец"],sess.map(s=>tr(td(s.session_id?`<a data-msgsession="${esc(s.session_id)}">${sid(s.session_id)}</a>`:"без сессии"),R(n(s.from_user)),R(n(s.messages)),R(n(s.longest)),td(esc(s.first_at)),td(esc(s.last_at))))):`<div class="empty">За этот период сессий нет.</div>`):"")+
    `<h2>Сообщения</h2>`+(m.rows.length?`<div class="msgs">${m.rows.map(msgRow).join("")}</div>`+(m.rows.length<+d.total?`<p><button id="mmore">Показать ещё (${n(+d.total-m.rows.length)})</button></p>`:""):`<div class="empty">С такими условиями ничего не найдено.</div>`);
}
async function loadMessages(append){
  const m=st.msg,w=windowDates();
  const p={view:"messages",sort:m.sort,role:m.role,min_len:String(m.minLen),source:m.source,limit:"50",offset:String(m.offset),from:w.from,to:w.to};
  if(m.user)p.user=m.user; if(m.session)p.session=m.session;
  const j=await call(p);
  m.data=j.data;m.capture=j.capture;
  m.rows=append?m.rows.concat(j.data.rows||[]):(j.data.rows||[]);
}

// ---------- подробные вкладки ----------
function modelTag(m){return `<span class="tag">${esc(String(m||"?").replace(/^claude-/,""))}</span>`;}
const tc=(tok,cost)=>`<div>${n(tok)}</div><div class="nd">${usd(cost)}</div>`;
function viewLog(rows){
  if(!rows.length) return `<div class="empty">За этот период запросов нет.</div>`;
  return `<p class="note">Последние ${n(rows.length)} запросов. Токены сверху, стоимость снизу, цена по model_pricing на день запроса. Фильтр «Кого считать» здесь не действует.</p>`+
  tbl(["Время","Модель","Кто","Тип",">Вход",">Выход",">Кэш чтение",">Кэш запись",">Всего",">Задержка","Сессия"],rows.map(r=>tr(td(esc(r.ts)),td(modelTag(r.model)),td(esc(r.ident)),td(esc(r.kind)+(r.over_token_ceiling?`<span class="tag w">потолок</span>`:"")),
    R(tc(r.input_tokens,r.input_cost)),R(tc(r.output_tokens,r.output_cost)),R(tc(r.cache_read_tokens,r.cache_cost)),R(tc(r.cache_creation_tokens,r.cache_write_cost)),td(usd(r.cost_usd),"r b"),R(n(r.latency_ms)+" мс"),td(r.session_id?`<a data-session="${esc(r.session_id)}">${sid(r.session_id)}</a>`:"-"))));
}
function viewSpending(rows){
  const chips=`<div class="fil"><label>Группировать <select id="sgroup">${GROUPS.map(([v,l])=>`<option value="${v}"${v===st.group?" selected":""}>${l}</option>`).join("")}</select></label></div>`;
  if(!rows.length) return chips+`<div class="empty">За этот период расходов нет.</div>`;
  const total=rows.reduce((s,r)=>s+ +r.cost_usd,0);
  const cell=(r)=>(st.group==="session"&&/^[0-9a-f-]{36}$/.test(String(r.grp)))?`<a data-session="${esc(r.grp)}">${sid(r.grp)}</a>`:esc(r.grp);
  return chips+`<p class="note">${n(rows.length)} групп, всего ${usd(total)}. Фильтр «Кого считать» здесь не действует.</p>`+
    tbl(["Группа",">Запросы",">Людей",">Устройств",">Расход",">Доля","Первый","Последний"],rows.map(r=>tr(td(cell(r)),R(n(r.turns)),R(n(r.users)),R(n(r.devices)),td(usd(r.cost_usd),"r b"),R(pct(r.cost_usd,total)),td(esc(r.first_at)),td(esc(r.last_at)))));
}
function viewCards(rows){
  if(!rows||!rows.length) return `<div class="empty">Карточек за этот период нет.</div>`;
  const secs=(v)=>v==null?"-":(+v<90?Math.round(+v)+" с":Math.round(+v/60)+" мин");
  const t=rows.reduce((a,r)=>{["proposed","confirmed","edited","dismissed","pending","legacy","incomplete"].forEach(k=>a[k]+=+r[k]||0);return a;},{proposed:0,confirmed:0,edited:0,dismissed:0,pending:0,legacy:0,incomplete:0});
  const answerable=t.proposed-t.legacy,accepted=t.confirmed+t.edited;
  return `<p class="note">Предложено ${n(t.proposed)}${t.legacy?` (${n(t.legacy)} ушли в старые сборки, которые не сообщают ответ, в проценты не входят)`:""}. Принято ${pct(accepted,answerable)||"0%"}, из них ${n(t.edited)} после правки. Отклонено ${pct(t.dismissed,answerable)||"0%"}. Без ответа больше часа: ${n(t.pending)}. Фильтр «Кого считать» здесь не действует.</p>`+
  tbl(["Тип",">Предложено",">Подтверждено",">С правкой",">Отклонено",">Без ответа",">Старые сборки",">Принято",">Неполные",">Время решения"],rows.map(r=>{const acc=(+r.confirmed||0)+(+r.edited||0),ans=(+r.proposed||0)-(+r.legacy||0);return tr(td(esc(r.kind)),R(n(r.proposed)),R(n(r.confirmed)),R(n(r.edited)),R(n(r.dismissed)),R(n(r.pending)),R(n(r.legacy)),td(pct(acc,ans)||"-","r b"),R(n(r.incomplete)),R(secs(r.median_seconds)));}))+
  `<p class="note">«С правкой»: карточка оказалась неточной, человек поправил её перед сохранением. Много таких значит проблему в промпте. «Неполные»: не хватало обязательного поля.</p>`;
}
function viewPeople(rows){
  if(!rows.length) return `<div class="empty">За этот период никто не пользовался чатом.</div>`;
  const sorted=[...rows].sort((a,b)=>(+b.cost_usd||0)-(+a.cost_usd||0));
  const anonPaid=(u)=>u.is_anonymous===true&&/^(lite|plus)/.test(String(u.plan_id||""));
  const flagged=sorted.filter(anonPaid).length;
  return `<p class="note">Сначала самые дорогие. Только метаданные и расход. Фильтр «Кого считать» здесь не действует.</p>`+(flagged?`<div class="warnbox"><b>${n(flagged)}</b> с платным планом всё ещё анонимны: при переустановке они потеряют доступ, если не дойдёт TRANSFER из RevenueCat.</div>`:"")+
  tbl(["Человек","План","Продление",">Запросы",">Расход",">Осталось",">Докупил","Последний раз",""],sorted.map(u=>tr(
    td(`<a data-user="${esc(u.user_id)}">${esc(u.ident)}</a>`+(u.is_test?`<span class="tag">тест</span>`:"")+(anonPaid(u)?`<span class="tag w">платит, аноним</span>`:"")),
    td(esc(u.plan_id||"-")),td(esc(u.period_end||"-")),R(n(u.reqs)),td(usd(u.cost_usd),"r b"),R(u.credits_remaining==null?"-":n(u.credits_remaining)),R(u.credits_topup?n(u.credits_topup):"-"),td(esc(u.last_seen)),
    td(`<a data-msguser="${esc(u.user_id)}">сообщения</a>`))));
}
function viewSessions(rows){
  const head=st.user?`<p class="note">Сессии человека ${sid(st.user)}. <a data-user="">Все люди</a></p>`:"";
  if(!rows.length) return head+`<div class="empty">За этот период сессий нет.</div>`;
  return head+tbl(["Сессия","Человек","Устройство",">Запросы",">Расход","Начало","Конец"],rows.map(s=>tr(td(`<a data-session="${esc(s.session_id)}">${sid(s.session_id)}</a>`),td(esc(s.ident)),td(s.device_id?sid(s.device_id):"-"),R(n(s.turns)),td(usd(s.cost_usd),"r b"),td(esc(s.started)),td(esc(s.ended)))));
}
function renderCardPayload(text){
  if(!text) return "";
  let o;try{o=JSON.parse(text);}catch(e){return "";}
  if(!o||typeof o!=="object") return "";
  const items=[...(Array.isArray(o.widgets)?o.widgets:[]).map(w=>({kind:(w&&(w.kind||w.type))||"карточка",data:(w&&(w.props||w.payload))||w})),...(Array.isArray(o.proposals)?o.proposals:[]).map(p=>({kind:(p&&p.kind)||"предложение",data:(p&&p.payload)||p}))];
  return items.map(c=>`<pre>${esc(c.kind)}\n${esc(JSON.stringify(c.data,null,1))}</pre>`).join("");
}
function viewSession(d){
  const reqs=d.requests||[],tx=d.transcript||[],io=d.io||[];
  const rt=`<h2>Запросы (${n(reqs.length)})</h2>`+(reqs.length?tbl(["Время","Тип","Модель",">Вход $",">Выход $",">Кэш чт. $",">Кэш зап. $",">Всего $",">Задержка"],reqs.map(r=>tr(td(esc(r.ts)),td(esc(r.kind)),td(esc(r.model||"-")),R(usd(r.input_cost,6)),R(usd(r.output_cost,6)),R(usd(r.cache_cost,6)),R(usd(r.cache_write_cost,6)),td(usd(r.cost_usd,6),"r b"),R(n(r.latency_ms)+" мс")))):`<div class="empty">Запросов нет.</div>`);
  const t=`<h2>Сохранённая переписка (${n(tx.length)})</h2>`+(tx.length?`<div class="msgs">${tx.map(m=>`<div class="m ${esc(m.role)}"><div class="h"><b>${esc(m.role==="assistant"?"Ассистент":m.role==="system"?"Система":"Человек")}</b><span>${esc(m.created_at)}</span>${m.widget_kind?`<span class="tag">${esc(m.widget_kind)}</span>`:""}</div><div class="t">${esc(m.text)}</div></div>`).join("")}</div>`:`<div class="empty">В chat_messages по этой сессии ничего нет.</div>`);
  const ioh=io.length?`<h2>Запись модели, llm_io_debug (${n(io.length)})</h2><div class="msgs">`+io.map(r=>{
      const um=r.user_message??"",ar=r.ai_response??"";
      const cards=renderCardPayload(r.output_text);
      return `<div class="m"><div class="h"><b>${esc(r.kind||"чат")}</b><span>${esc(r.model||"-")}</span><span>${esc(r.ts||"")}</span><span>${n(r.input_tokens)} / ${n(r.output_tokens)} токенов</span><span>${usd(r.cost_usd,6)}</span></div>
      <div class="t"><b>Человек:</b> ${esc(um)}</div><div class="t"><b>Ассистент:</b> ${esc(ar)}</div>${cards}</div>`;}).join("")+`</div>`:`<h2>Запись модели</h2><div class="empty">В llm_io_debug по этой сессии ничего нет.</div>`;
  return `<p class="note"><a data-back="1">Все сессии</a></p>`+rt+t+ioh;
}

// ---------- отрисовка ----------
function renderTabs(){
  $("tabs").innerHTML=TABS.map(([v,l])=>v==="|"?`<span class="tabsep"></span>`:`<button class="tab ${v===st.tab?"on":""}" data-tab="${v}">${l}</button>`).join("");
  const on=document.querySelector(".tab.on"); if(on) on.scrollIntoView({inline:"center",block:"nearest"});
}
const mainEl=()=>$("main");
let renderTok=0;
async function render(){
  const tok=++renderTok;   // a slow answer must not paint over a tab opened after it
  renderTabs();
  mainEl().innerHTML=`<p class="note">Загружаю ${esc(SERVERS[st.server].label)}, период ${period()}...</p>`;
  const w=windowDates();
  try{
    let html;
    if(STATS_TABS.has(st.tab)){
      if(!st.stats) st.stats=call({view:"stats",from:w.from,to:w.to,audience:st.audience}).catch(e=>{st.stats=null;throw e;});
      const d=await st.stats;
      if(!d.sections){ throw new Error("На этом сервере ещё старая версия функции admin-dashboard."); }
      if(d.project_ref&&d.project_ref!==SERVERS[st.server].ref) throw new Error("Ответил не тот сервер: ожидался "+SERVERS[st.server].ref+".");
      const head=Object.values(d.sections).filter(s=>s&&s.error).length?`<div class="err">Часть разделов не загрузилась, остальные ниже настоящие.</div>`:"";
      html=head+({summary:viewSummary,users:viewUsers,money:viewMoney,funnel:viewFunnel,chat:viewChat,features:viewFeatures,health:viewHealth}[st.tab])(d);
    }else if(st.tab==="messages"){
      st.msg.offset=0; await loadMessages(false); html=viewMessages();
    }else{
      const base={from:w.from,to:w.to,days:"3650"};
      if(st.tab==="log") html=viewLog((await call({...base,view:"log"})).data||[]);
      else if(st.tab==="spending") html=viewSpending((await call({...base,view:"spending",group:st.group})).data||[]);
      else if(st.tab==="cards") html=viewCards((await call({...base,view:"cards"})).data||[]);
      else if(st.tab==="people") html=viewPeople((await call({...base,view:"users"})).data||[]);
      else if(st.tab==="sessions"){
        if(st.session) html=viewSession((await call({view:"session",session:st.session})).data||{});
        else html=viewSessions((await call({...base,view:"sessions",...(st.user?{user:st.user}:{})})).data||[]);
      }
    }
    if(tok!==renderTok) return;
    mainEl().innerHTML=`<p class="note">Сервер: <b>${esc(SERVERS[st.server].label)}</b>. Период: ${period()}, UTC. ${STATS_TABS.has(st.tab)?"Кого считать: "+esc({real:"реальные",test:"тестовые",all:"все"}[st.audience])+".":""}</p>`+html;
  }catch(e){
    if(tok!==renderTok) return;
    mainEl().innerHTML=`<div class="err">${esc(e.message)}</div>`;
  }
}
function reload(){st.stats=null;render();}

document.addEventListener("click",(e)=>{
  const t=e.target.closest("[data-tab],[data-user],[data-session],[data-back],[data-msguser],[data-msgsession],#mreset,#mmore,#go"); if(!t)return;
  if(t.id==="go"){store.set("aisance_admin",JSON.stringify({server:st.server,key:$("key").value.trim()}));reload();return;}
  if(t.id==="mreset"){st.msg.user=null;st.msg.session=null;render();return;}
  if(t.id==="mmore"){(async()=>{try{st.msg.offset=st.msg.rows.length;await loadMessages(true);mainEl().innerHTML=viewMessages();}catch(err){mainEl().innerHTML=`<div class="err">${esc(err.message)}</div>`;}})();return;}
  if(t.dataset.tab){st.tab=t.dataset.tab;st.session=null;if(st.tab!=="sessions")st.user=null;}
  else if(t.dataset.msguser!=null){st.msg.user=t.dataset.msguser;st.msg.session=null;st.tab="messages";}
  else if(t.dataset.msgsession!=null){st.msg.session=t.dataset.msgsession;st.tab="messages";}
  else if(t.dataset.session!=null){st.session=t.dataset.session;st.tab="sessions";}
  else if(t.dataset.user!=null){st.user=t.dataset.user||null;st.session=null;st.tab="sessions";}
  else if(t.dataset.back){st.session=null;}
  render();
  window.scrollTo(0,0);
});
document.addEventListener("change",(e)=>{
  const id=e.target.id;
  if(id==="server"){st.server=e.target.value;st.msg.user=null;st.msg.session=null;st.user=null;st.session=null;if($("key").value.trim())reload();}
  else if(id==="preset"){st.preset=e.target.value;$("dates").hidden=st.preset!=="custom";
    if(st.preset==="custom"){if(!st.to){st.to=today();st.from=shift(29);}$("dfrom").value=st.from;$("dto").value=st.to;}
    if($("key").value.trim())reload();}
  else if(id==="dfrom"||id==="dto"){
    const v=e.target.value;if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return;
    if(id==="dfrom"){st.from=v;if(st.to<v){st.to=v;$("dto").value=v;}}else{st.to=v;if(st.from>v){st.from=v;$("dfrom").value=v;}}
    reload();}
  else if(id==="aud"){st.audience=e.target.value;if($("key").value.trim())reload();}
  else if(id==="sgroup"){st.group=e.target.value;render();}
  else if(id==="msort"){st.msg.sort=e.target.value;render();}
  else if(id==="mrole"){st.msg.role=e.target.value;render();}
  else if(id==="mmin"){st.msg.minLen=+e.target.value||0;render();}
  else if(id==="msrc"){st.msg.source=e.target.value;render();}
});
$("key").addEventListener("keydown",(e)=>{if(e.key==="Enter")$("go").click();});
(function init(){
  $("server").innerHTML=Object.entries(SERVERS).map(([k,v])=>`<option value="${k}">${esc(v.label)}</option>`).join("");
  let saved={};try{saved=JSON.parse(store.get("aisance_admin")||"{}");}catch(e){}
  if(saved.server&&SERVERS[saved.server])st.server=saved.server;
  $("server").value=st.server;$("preset").value=st.preset;$("key").value=saved.key||"";
  renderTabs();
  if(saved.key)render();
})();
</script>
</body>
