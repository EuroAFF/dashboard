<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AISANCE · cost & behaviour dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root{--teal:#0f766e;--teal2:#1d9e75;--ink:#1c2b2b;--muted:#5b6b6b;--line:#e4ecea;--bg:#f7faf9;--card:#fff;--danger:#b4453c;--amber:#b5791a;--blue:#2f6fb0;--violet:#6d5bd0;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{padding:14px 24px;border-bottom:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
  header h1{font-size:16px;margin:0;color:var(--teal);font-weight:700;letter-spacing:.3px}
  header .t{color:var(--muted);font-size:13px;flex:1}
  header input{font:13px monospace;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
  header input#key{width:200px}
  header button{padding:6px 12px;border:1px solid var(--teal);color:var(--teal);background:var(--card);border-radius:8px;font-weight:600;cursor:pointer;font-size:13px}
  main{padding:18px 24px;max-width:1180px;margin:0 auto}
  .nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .tabs,.filters,.seg{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
  .seg{margin-right:6px;color:var(--muted);font-size:12px}
  .tab{padding:7px 13px;border-radius:9px;color:var(--muted);font-weight:600;font-size:14px;cursor:pointer;border:none;background:none}
  .tab.on{background:var(--teal);color:#fff}
  .chip{padding:5px 10px;border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:12px;background:var(--card);cursor:pointer}
  .chip.on{border-color:var(--teal);color:var(--teal);font-weight:600;background:#eaf5f1}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px}
  .cv{font-size:23px;font-weight:700}.cl{color:var(--muted);font-size:12px;margin-top:2px}.cs{color:var(--teal);font-size:12px;margin-top:4px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
  .grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}
  .insights{display:flex;flex-direction:column;gap:9px}
  .ins{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
  .ins .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:6px 0 16px}
  th,td{padding:8px 11px;text-align:left;border-bottom:1px solid var(--line);font-size:12.5px;white-space:nowrap}
  th{background:#eef5f3;color:var(--muted);font-weight:600}
  td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
  td.b{font-weight:700;color:var(--teal)}
  tr:last-child td{border-bottom:0}
  a{color:var(--teal);cursor:pointer}
  h3{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:0 0 8px}
  .barcell{position:relative;min-width:90px}
  .barcell .fill{position:absolute;left:0;top:50%;transform:translateY(-50%);height:14px;background:#d7efe6;border-radius:4px;z-index:0}
  .barcell span{position:relative;z-index:1}
  .muted{color:var(--muted)}.b{font-weight:700}
  /* TOKENS AND COST IN ONE CELL. The Log used to show only dollars, with the token count hidden in
     a title tooltip — invisible when scanning, and impossible to compare across rows. Cost is the
     derived number; tokens are the fact. Both are shown, tokens above in the muted size. */
  .tk{font-size:11px;color:var(--muted);line-height:1.25}
  .amt{font-variant-numeric:tabular-nums;line-height:1.25}
  /* The model each row was priced at. Two models at different rates share this table, so a row's
     dollars cannot be read without knowing which. */
  .mdl{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.3px;padding:2px 6px;
       border-radius:999px;white-space:nowrap}
  .m5{background:#e6f4ef;color:#0f7d63;border:1px solid #bfe3d8}
  .m46{background:#f1eef8;color:#5b4a97;border:1px solid #d9d1ee}
  .mx{background:#f5f5f5;color:#666;border:1px solid #e2e2e2}
  .badge{display:inline-block;background:#fde9c8;color:#8a5a00;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:600}
  .badge.an{background:#eef2f7;color:#3f5a78}
  .err{background:#fbeaea;border:1px solid #efc9c6;color:var(--danger);padding:12px 14px;border-radius:10px}
  code{background:#eef5f3;border-radius:5px;padding:1px 5px;font-size:12px}
  .chat{display:flex;flex-direction:column;gap:9px;max-width:780px}
  .msg .who{font-size:11px;color:var(--muted);margin-bottom:3px;display:flex;gap:8px}.msg .ts{margin-left:auto}
  .bubble{padding:9px 12px;border-radius:12px;white-space:pre-wrap;word-break:break-word;font-size:13.5px}
  .msg.u .bubble{background:var(--teal);color:#fff}.msg.a .bubble{background:#fff;border:1px solid var(--line)}.msg.s .bubble{background:#fff7e6;border:1px solid #f0e2c0;font-style:italic}
  .mwidget{border:1px solid var(--teal);border-left:3px solid var(--teal);border-radius:10px;padding:8px 10px;margin:4px 0;background:#f2faf7}
  .mwidget .mwk{font-size:11px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
  .mwidget .mwr{display:flex;gap:8px;font-size:12.5px;padding:1px 0}
  .mwidget .mwr .k{color:var(--muted);min-width:92px;flex:none}
  .mwidget .mwr .v{color:var(--ink);font-weight:600;word-break:break-word}
  .iod{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;padding:6px 12px}
  .iod summary{cursor:pointer;font-size:12.5px;color:var(--muted);font-weight:600}
  .iogrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
  .iol{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
  .iod pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:11.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word;max-height:340px;overflow:auto;margin:0}
  @media(max-width:760px){.iogrid{grid-template-columns:1fr}}
  @media(max-width:760px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>AISANCE</h1><span class="t">cost &amp; behaviour · token observability</span>
  <input id="base" title="function base URL">
  <input id="key" type="password" placeholder="admin key" title="ADMIN_DASHBOARD_SECRET">
  <button id="go">Load</button>
</header>
<main>
  <div class="nav"><div class="tabs" id="tabs"></div><div class="filters" id="filters"></div></div>
  <div id="content"><p class="muted">Enter the admin key and press Load.</p></div>
</main>
<script>
const DEFAULT_BASE="https://sdmhghqecsiddiitorgs.supabase.co/functions/v1/admin-dashboard";
const VIEWS=[["overview","Overview"],["log","Log"],["spending","Spending"],["cards","Cards"],["users","Users"],["sessions","Sessions"]];
const GROUPS=["kind","user","session","device","time"];
const st={view:"overview",days:3650,eval:false,group:"user",session:null,user:null};
let charts=[];

const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const n=(x)=>Number(x||0).toLocaleString("en-US");
const usd=(x)=>"$"+Number(x||0).toFixed(Number(x)>=1?2:4);
const usd6=(x)=>"$"+Number(x||0).toFixed(6);
const pct=(a,b)=>b?Math.round(a/b*100)+"%":"0%";
const sid=(x)=>x?esc(String(x).slice(0,8)):"—";
const cfg=()=>({base:$("base").value.trim()||DEFAULT_BASE,key:$("key").value.trim()});
const persist=()=>{const c=cfg();localStorage.setItem("aisance_dash",JSON.stringify(c));};

async function api(extra={}){
  const c=cfg(); if(!c.key) throw new Error("Enter the admin key first.");
  const p=new URLSearchParams({key:c.key,format:"json",view:st.view,days:String(st.days)});
  if(st.eval)p.set("eval","1");
  if(st.view==="spending")p.set("group",st.group);
  if(st.user)p.set("user",st.user);
  if(st.session)p.set("session",st.session);
  Object.entries(extra).forEach(([k,v])=>p.set(k,v));
  const res=await fetch(c.base+"?"+p.toString());
  const j=await res.json().catch(()=>({error:"bad_response"}));
  if(!res.ok||j.error) throw new Error(j.error==="unauthorized"?"Key rejected (401). Check the admin key.":(j.error||("HTTP "+res.status)));
  return j.data;
}

function renderControls(){
  $("tabs").innerHTML=VIEWS.map(([v,l])=>`<button class="tab ${v===st.view||(v==='sessions'&&st.view==='session')?'on':''}" data-v="${v}">${l}</button>`).join("");
  const grp=st.view==="spending"?`<span class="seg">group</span>${GROUPS.map(g=>`<span class="chip ${g===st.group?'on':''}" data-g="${g}">${g}</span>`).join("")}<span style="width:10px"></span>`:"";
  const days=[7,30,90,3650].map(d=>`<span class="chip ${d===st.days?'on':''}" data-d="${d}">${d>=3650?'all':d+'d'}</span>`).join("");
  const ev=`<span class="chip ${st.eval?'on':''}" data-eval="1">incl. eval</span>`;
  $("filters").innerHTML=grp+days+ev;
}

function donut(id,parts){
  const el=document.getElementById(id); if(!el)return;
  charts.push(new Chart(el,{type:"doughnut",data:{labels:parts.map(p=>p.label),datasets:[{data:parts.map(p=>+p.v),backgroundColor:parts.map(p=>p.c),borderWidth:0}]},options:{cutout:"62%",plugins:{legend:{display:false},tooltip:{callbacks:{label:(c)=>c.label+": $"+(+c.parsed).toFixed(4)}}}}}));
}
function bars(id,labels,data){
  const el=document.getElementById(id); if(!el)return;
  charts.push(new Chart(el,{type:"bar",data:{labels,datasets:[{data,backgroundColor:"#1d9e75",borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:(c)=>"$"+(+c.parsed.y).toFixed(4)}}},scales:{x:{grid:{display:false},ticks:{font:{size:10},maxRotation:45,autoSkip:false}},y:{ticks:{font:{size:10},callback:v=>"$"+(+v).toFixed(2)}}}}}));
}

async function render(){
  renderControls();
  charts.forEach(c=>{try{c.destroy()}catch(e){}}); charts=[];
  $("content").innerHTML=`<p class="muted">Loading…</p>`;
  try{
    const d=await api();
    if(st.view==="overview"){ $("content").innerHTML=overview(d); paintOverview(d); }
    else if(st.view==="log") $("content").innerHTML=logTable(d);
    else if(st.view==="spending") $("content").innerHTML=spendingTable(d);
    else if(st.view==="cards") $("content").innerHTML=cardsTable(d);
    else if(st.view==="users") $("content").innerHTML=usersTable(d);
    else if(st.view==="sessions") $("content").innerHTML=sessionsTable(d);
    else if(st.view==="session") $("content").innerHTML=sessionDetail(d);
  }catch(e){ $("content").innerHTML=`<div class="err">${esc(e.message)}</div>`; }
}

function overview(o){
  const cb=o.cost_breakdown||{}; const cost=+o.cost_usd||0;
  const card=(l,v,s)=>`<div class="card"><div class="cv">${v}</div><div class="cl">${esc(l)}</div>${s?`<div class="cs">${s}</div>`:""}</div>`;
  const cards=`<div class="cards">
    ${card("Total cost",usd(cost),n(o.credits)+" credits")}
    ${card("Requests",n(o.requests),n(o.users)+" users · "+n(o.sessions)+" sessions")}
    ${card("Not charged",n(o.undebited_requests ?? o.anon_requests),
           (o.undebited_cost_usd!=null?usd(o.undebited_cost_usd)+" · ":"")+pct(o.undebited_requests ?? o.anon_requests,o.requests)+" of requests")}
    ${card("Avg cost / request",usd(cost/(o.requests||1)))}
    ${card("Ceiling hits",n(o.ceiling_hits),pct(o.ceiling_hits,o.requests)+" of turns")}
    ${card("Cache-read",n(o.cache_read)+" tok",pct(o.cache_read,(+o.input)+(+o.cache_read))+" of input served cached")}
  </div>`;
  const parts=[{label:"Input",v:cb.input,c:"#1d9e75"},{label:"Output",v:cb.output,c:"#2f6fb0"},{label:"Cache-read",v:cb.cache_read,c:"#b5791a"},{label:"Cache-write",v:cb.cache_write,c:"#6d5bd0"}].filter(p=>+p.v>0);
  const legend=parts.map(p=>`<div style="display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0"><span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${p.c};margin-right:7px"></span>${p.label}</span><span class="b">${usd(p.v)} <span class="muted">(${pct(p.v,cost)})</span></span></div>`).join("");
  const burden=`<div class="panel"><h3>Where the cost goes</h3><div style="display:flex;gap:16px;align-items:center"><div style="width:150px;height:150px;flex:none"><canvas id="cbd"></canvas></div><div style="flex:1">${legend}</div></div></div>`;
  const ins=insights(o);
  const trend=`<div class="panel"><h3>Daily cost</h3><div style="height:200px"><canvas id="byday"></canvas></div></div>`;
  const kinds=`<div class="panel"><h3>By operation kind</h3><table><tr><th>kind</th><th class="r">requests</th><th class="r">cost</th><th class="r">share</th></tr>${(o.by_kind||[]).map(k=>`<tr><td>${esc(k.kind)}</td><td class="r">${n(k.reqs)}</td><td class="r b">${usd(k.cost)}</td><td class="r">${pct(k.cost,cost)}</td></tr>`).join("")}</table></div>`;
  return cards+`<div class="grid2">${burden}<div class="panel"><h3>Conclusions</h3><div class="insights">${ins}</div></div></div>`+economics(o)+`<div class="grid2">${trend}${kinds}</div>`;
}

// ---- #8: token economics — cost per message, messages per $1.50, plan limits, metering check ----
// 1 credit = $0.005 of tokens; each turn debits max(1, ceil(cost / $0.005)).  Mirrors core.ts.
const CREDIT_USD = 0.005;
// public.billing_plans (id / credits_per_period / price_hint)
const PLANS = [
  { name: "Lite",  credits: 400,  price: 9.99,  hint: "$9.99 / mo" },
  { name: "Plus",  credits: 1200, price: 19.99, hint: "$19.99 / mo" },
];

function economics(o){
  const card=(l,v,s)=>`<div class="card"><div class="cv">${v}</div><div class="cl">${esc(l)}</div>${s?`<div class="cs">${s}</div>`:""}</div>`;
  const cost=+o.cost_usd||0, reqs=+o.requests||0, creds=+o.credits||0;
  const inTok=+o.input||0, outTok=+o.output||0;
  const avgCost   = reqs ? cost/reqs : 0;
  const avgTokens = reqs ? (inTok+outTok)/reqs : 0;
  const avgCred   = reqs ? creds/reqs : 0;
  const msgs150   = avgCost ? 1.50/avgCost : 0;          // «сколько сообщений, чтобы потратить $1.50»
  // COMPARE LIKE WITH LIKE. This used to divide TOTAL cost by credits debited, while ~16% of turns
  // are never debited at all (anonymous-auth users). Their cost sat in the numerator and their
  // credits could not sit in the denominator, so the ratio read 0.94x under a caption calling that
  // under-charging. Falls back to total cost only for an older admin_overview that cannot answer.
  const chargedCost = o.debited_cost_usd!=null ? +o.debited_cost_usd : cost;
  const unCost      = +(o.undebited_cost_usd ?? 0);
  const implied     = chargedCost / CREDIT_USD;
  const overhead    = implied ? creds/implied : 0;

  const cards=`<div class="cards">
    ${card("Avg cost / message", usd6(avgCost), n(Math.round(avgTokens))+" tokens per message")}
    ${card("Messages per $1.50", n(Math.round(msgs150)), "at the current average")}
    ${card("Avg credits / message", avgCred.toFixed(2), "1 credit = $"+CREDIT_USD.toFixed(3))}
    ${card("Token in : out", n(inTok)+" : "+n(outTok), outTok ? (inTok/outTok).toFixed(1)+"× more input than output" : "—")}
  </div>`;

  // Сверка метеринга: списанные кредиты vs кредиты, вытекающие из реальной стоимости токенов.
  const meter=`<div class="panel"><h3>Credit metering check</h3><table>
    <tr><th>what</th><th class="r">value</th></tr>
    <tr><td>Token cost of <b>charged</b> turns</td><td class="r b">${usd(chargedCost)}</td></tr>
    <tr><td>Credits actually debited</td><td class="r b">${n(creds)}</td></tr>
    <tr><td>Credits implied by that cost (no rounding)</td><td class="r">${n(Math.round(implied))}</td></tr>
    <tr><td>Rounding overhead</td><td class="r b">${overhead ? overhead.toFixed(2)+"×" : "—"}</td></tr>
    ${unCost>0?`<tr><td class="muted">Token cost of turns nobody was charged for</td><td class="r muted">${usd(unCost)}</td></tr>`:""}
    </table>
    <p class="muted">Every turn debits <code>max(1, ceil(cost / $0.005))</code>, so debited credits sit ABOVE the token cost of those same turns. That gap is the rounding overhead — expected, not an error. Below 1× would mean under-charging.<br>
    Uncharged turns are excluded from the ratio on purpose: their cost is real but they have no credits to compare it against, and mixing them in made this read 0.94× when charging was correct.</p></div>`;

  // Таблица лимитов: что план реально даёт пользователю, по ЖИВОМУ среднему.
  const rows=PLANS.map(p=>{
    const budget=p.credits*CREDIT_USD;
    const msgs=avgCred ? Math.round(p.credits/avgCred) : 0;
    const margin=(p.price&&budget) ? (p.price/budget).toFixed(1)+"×" : "—";
    return `<tr><td>${esc(p.name)}</td><td class="r">${n(p.credits)}</td><td class="r b">${n(msgs)}</td><td class="r">${usd(budget)}</td><td class="r">${esc(p.hint)}</td><td class="r">${margin}</td></tr>`;
  }).join("");
  const limits=`<div class="panel"><h3>Plan limits — what a user actually gets</h3><table>
    <tr><th>plan</th><th class="r">credits</th><th class="r">≈ messages</th><th class="r">token budget</th><th class="r">price</th><th class="r">margin</th></tr>${rows}
    </table>
    <p class="muted">“≈ messages” uses the LIVE average of <b>${avgCred.toFixed(2)}</b> credits/message — it moves with real usage. “Token budget” = credits × $0.005 (what the plan may spend on tokens). “Margin” = price ÷ token budget.</p></div>`;

  return `<div class="panel" style="background:none;border:0;padding:0"><h3>Token economics &amp; plan limits</h3></div>`+cards+`<div class="grid2">${meter}${limits}</div>`;
}
function insights(o){
  const cb=o.cost_breakdown||{}; const cost=+o.cost_usd||0;
  const pairs=[["input",cb.input,"#1d9e75","Input tokens (system prompt + memory digest sent every turn)"],["output",cb.output,"#2f6fb0","Model output"],["cache_read",cb.cache_read,"#b5791a","Cache reads"],["cache_write",cb.cache_write,"#6d5bd0","Cache writes"]];
  const top=pairs.filter(p=>+p[1]>0).sort((a,b)=>b[1]-a[1])[0];
  const out=[];
  if(top) out.push([top[2],`<b>${top[0].replace("_","-")} is your biggest cost driver</b> — ${usd(top[1])} (${pct(top[1],cost)}). ${top[0]==="input"?"Trimming the system prompt / digest is the highest-leverage saving.":""}`]);
  const cacheEff=pct(o.cache_read,(+o.input)+(+o.cache_read));
  out.push(["#b5791a",`Caching serves <b>${cacheEff}</b> of input tokens at a tenth of the base input rate — meaningful savings already.`]);
  if(+o.cache_write===0) out.push(["#b4453c",`<b>Cache-write tokens read 0</b> — they aren't captured in older rows. After the proxy update they'll show here (Anthropic bills a cache write at 1.25x the base input rate).`]);
  // WAS: "0 anonymous requests logged — ... wasn't recorded". Both halves were wrong. `anon_requests`
  // counts rows with no user_id, which is nobody: an anonymous-AUTH user still has an id. And those
  // turns are recorded — they are simply never debited. 278 of them, $1.32, invisible until now.
  const und=+(o.undebited_requests ?? 0), undC=+(o.undebited_cost_usd ?? 0);
  if(und>0) out.push(["#3f5a78",`<b>${n(und)} turns (${pct(und,o.requests)}) cost ${usd(undC)} and were never charged</b> — anonymous-auth users have no credit row. Intended, but it is real spend with no credit against it.`]);
  else out.push(["#3f5a78",`Every request in this window was charged against a credit balance.`]);
  out.push(["#1d9e75",`Average turn costs <b>${usd(cost/(o.requests||1))}</b>; ${pct(o.ceiling_hits,o.requests)} of turns hit the per-turn token ceiling.`]);
  return out.map(([c,t])=>`<div class="ins"><span class="dot" style="background:${c}"></span><span>${t}</span></div>`).join("");
}
function paintOverview(o){
  const cb=o.cost_breakdown||{};
  donut("cbd",[{label:"Input",v:cb.input,c:"#1d9e75"},{label:"Output",v:cb.output,c:"#2f6fb0"},{label:"Cache-read",v:cb.cache_read,c:"#b5791a"},{label:"Cache-write",v:cb.cache_write,c:"#6d5bd0"}].filter(p=>+p.v>0));
  const days=(o.by_day||[]).slice().reverse();
  bars("byday",days.map(d=>d.day.slice(5)),days.map(d=>+d.cost));
}

// Short label for the model a row was priced at. Unknown models are NOT silently blanked — they get
// the neutral chip and their raw name, because an unpriced model is exactly the thing worth seeing.
function modelChip(m){
  const s=String(m||"");
  if(s==="claude-sonnet-5")   return `<span class="mdl m5" title="${esc(s)} · $2 / $10 / $0.20 / $2.50 per Mtok">S5</span>`;
  if(s==="claude-sonnet-4-6") return `<span class="mdl m46" title="${esc(s)} · $3 / $15 / $0.30 / $3.75 per Mtok">S4.6</span>`;
  return `<span class="mdl mx" title="${esc(s)} — no price row; costed from the '*' fallback">${esc(s.replace(/^claude-/,"")||"?")}</span>`;
}
// tokens above, dollars below — the fact and the number derived from it, in one column.
function tc(tok,usd){ return `<div class="tk">${n(tok)}</div><div class="amt b">${usd6(usd)}</div>`; }

function logTable(rows){
  if(!rows.length) return `<p class="muted">No requests in this window.</p>`;
  return `<p class="muted">Most recent ${rows.length} requests · tokens above, cost below. Each row is priced at the rate in force on its own date for <b>its own model</b> (<code>model_pricing</code>) — Sonnet 5 $2 / $10 / $0.20 / $2.50 per million, Sonnet 4.6 was $3 / $15 / $0.30 / $3.75. Two models at different rates share this table, so the chip is what makes a row's dollars readable.</p>
  <table><tr>
    <th>timestamp</th><th>model</th><th>who</th><th>kind</th>
    <th class="r">input</th><th class="r">output</th><th class="r">cache read</th><th class="r">cache write</th>
    <th class="r">tokens</th><th class="r">total $</th><th class="r">latency</th><th>session</th>
  </tr>${rows.map(r=>{
    const tot = Number(r.input_tokens||0)+Number(r.output_tokens||0)
              + Number(r.cache_read_tokens||0)+Number(r.cache_creation_tokens||0);
    return `<tr>
      <td>${esc(r.ts)}</td>
      <td>${modelChip(r.model)}</td>
      <td>${who(r.ident)}</td>
      <td>${esc(r.kind)}${r.over_token_ceiling?' <span class="badge">&#9888;</span>':''}</td>
      <td class="r">${tc(r.input_tokens, r.input_cost)}</td>
      <td class="r">${tc(r.output_tokens, r.output_cost)}</td>
      <td class="r">${tc(r.cache_read_tokens, r.cache_cost)}</td>
      <td class="r">${tc(r.cache_creation_tokens, r.cache_write_cost)}</td>
      <td class="r b">${n(tot)}</td>
      <td class="r b">${usd6(r.cost_usd)}</td>
      <td class="r">${n(r.latency_ms)}ms</td>
      <td>${r.session_id?`<a data-session="${esc(r.session_id)}">${sid(r.session_id)}</a>`:"&mdash;"}</td>
    </tr>`;
  }).join("")}</table>`;
}
function who(id){ return id==="anonymous"?`<span class="badge an">anon</span>`:esc(id); }
function spendingTable(rows){
  if(!rows.length) return `<p class="muted">No spending in this window.</p>`;
  const total=rows.reduce((s,r)=>s+ +r.cost_usd,0); const max=Math.max(...rows.map(r=>+r.cost_usd),0.0001);
  const head={session:"session",device:"device",time:"day",user:"user",kind:"kind"}[st.group];
  const cell=(r)=>(st.group==="session"&&/^[0-9a-f-]{36}$/.test(String(r.grp)))?`<a data-session="${esc(r.grp)}">${sid(r.grp)}</a>`:who(r.grp);
  return `<p class="muted">Grouped by <b>${esc(st.group)}</b> · ${rows.length} groups · total ${usd(total)}.</p><table><tr><th>${esc(head)}</th><th class="r">turns</th><th class="r">users</th><th class="r">devices</th><th class="r">cost</th><th class="barcell">share</th><th>first</th><th>last</th></tr>${rows.map(r=>`<tr><td>${cell(r)}</td><td class="r">${n(r.turns)}</td><td class="r">${n(r.users)}</td><td class="r">${n(r.devices)}</td><td class="r b">${usd(r.cost_usd)}</td><td class="barcell"><span class="fill" style="width:${Math.round(+r.cost_usd/max*100)}%"></span><span>${pct(r.cost_usd,total)}</span></td><td>${esc(r.first_at)}</td><td>${esc(r.last_at)}</td></tr>`).join("")}</table>`;
}
function limitStatus(u){ // #4 — approaching = ≥80% of allowance used; at limit = none left
  const cap=+u.credits||0; if(!cap||u.credits_remaining==null) return "—";
  const rem=+u.credits_remaining;
  if(rem<=0) return '<span class="badge">⛔ at limit</span>';
  if((cap-rem)/cap>=0.8) return '<span class="badge">⚠︎ approaching</span>';
  return "OK";
}
// Apple's cut on a subscription. Margin is computed on what actually lands, not the sticker price.
const APPLE_CUT = 0.15;

// A paid plan on an anonymous account: they bought, but never secured an account, so a reinstall
// loses their access and the first you hear of it is a refund request. Their entitlement only
// survives if RevenueCat's TRANSFER webhook lands — and that has silently failed here before.
function anonPaid(u){ return u.is_anonymous === true && (u.plan_id === "lite" || u.plan_id === "plus"); }

// What this user is worth against what they cost us this window. Null unless we know both.
function userMargin(u){
  const plan = PLANS.find(p => p.name.toLowerCase() === String(u.plan_id||"").toLowerCase());
  if(!plan) return null;
  const net = plan.price * (1 - APPLE_CUT);
  const cost = +u.cost_usd || 0;
  return { net, cost, pct: (net - cost) / net * 100 };
}

// Cards — what the coach proposed and what the user did about it (admin_cards).
// Rates are quoted against the population that CAN answer: a card sent to a build older than
// outcome reporting is counted under "can\'t report" and kept out of every percentage, otherwise
// the whole funnel reads as a product failure while those builds are still in users\' hands.
// Read-only cards (charts, advisories) never reach this table — nobody was asked to answer them.
function cardsTable(rows){
  if(!rows||!rows.length) return `<p class="muted">No cards yet. Rows appear once the proxy that records them is deployed; outcomes ride along on the app\'s NEXT turn, so a fresh confirm takes a while to show up.</p>`;
  const secs=(v)=>v==null?"—":(+v<90?Math.round(+v)+"s":Math.round(+v/60)+"m");
  const t=rows.reduce((a,r)=>{["proposed","confirmed","edited","dismissed","pending","legacy","incomplete"].forEach(k=>a[k]+=+r[k]||0);return a;},
                      {proposed:0,confirmed:0,edited:0,dismissed:0,pending:0,legacy:0,incomplete:0});
  const answerable=t.proposed-t.legacy, accepted=t.confirmed+t.edited;
  const head=`<p class="muted">${n(t.proposed)} cards proposed${t.legacy?` (${n(t.legacy)} to builds that can\'t report — excluded from the rates)`:""} · <b>${pct(accepted,answerable)} accepted</b> (${n(t.edited)} needed correcting first) · ${pct(t.dismissed,answerable)} thrown away · ${n(t.pending)} unanswered after an hour.</p>`;
  return head+`<table><tr><th>kind</th><th class="r">proposed</th><th class="r">confirmed</th><th class="r">edited</th><th class="r">dismissed</th><th class="r">unanswered</th><th class="r">can\'t report</th><th class="r">accepted</th><th class="r">incomplete</th><th class="r">median decision</th></tr>${
    rows.map(r=>{
      const acc=(+r.confirmed||0)+(+r.edited||0), ans=(+r.proposed||0)-(+r.legacy||0);
      return `<tr><td>${esc(r.kind)}</td><td class="r">${n(r.proposed)}</td><td class="r">${n(r.confirmed)}</td><td class="r">${n(r.edited)}</td><td class="r">${n(r.dismissed)}</td><td class="r">${n(r.pending)}</td><td class="r">${n(r.legacy)}</td><td class="r b">${pct(acc,ans)}</td><td class="r">${+r.incomplete>0?`<span class="badge">⚠︎ ${n(r.incomplete)}</span>`:"0"}</td><td class="r">${secs(r.median_seconds)}</td></tr>`;
    }).join("")}</table>
  <p class="muted">“edited” means the card was wrong enough that the user corrected it before saving — a high number there is a prompt problem, not a UI one. “incomplete” counts cards that arrived missing a required parameter, which is what a truncated turn looks like from the server.</p>`;
}
function usersTable(rows){
  if(!rows.length) return `<p class="muted">No usage in this window.</p>`;
  const sorted=[...rows].sort((a,b)=>(+b.cost_usd||0)-(+a.cost_usd||0)); // #4 — highest cost first
  const flagged=sorted.filter(anonPaid).length;
  // Every field below already existed in the database; the Users tab just never asked for it.
  // period_end / credits_topup / is_anonymous arrive from admin_users — older deploys omit them,
  // so each cell falls back to "—" rather than rendering "undefined".
  const warn=flagged?`<p class="muted" style="color:#b45309"><b>${flagged}</b> paid ${flagged===1?"account is":"accounts are"} still anonymous — they lose access on reinstall unless RevenueCat's TRANSFER lands.</p>`:"";
  return `<p class="muted">Sorted by cost (highest first). Email → iCloud anchor → anon id. Click a user to see their sessions.</p>${warn}<table><tr><th>user</th><th>plan</th><th>renews</th><th>status</th><th class="r">reqs</th><th class="r">cost</th><th class="r">month left</th><th class="r">top-up</th><th class="r">margin</th><th>last seen</th></tr>${sorted.map(u=>{
    const m=userMargin(u);
    // credits_remaining is already (monthly left + top-up), so the monthly half is the difference —
    // no need for credits_used. Without credits_topup (older deploy) fall back to the sum as-is.
    const monthLeft=(u.credits_remaining==null) ? "—"
      : (u.credits_topup==null ? n(u.credits_remaining) : n(Math.max(u.credits_remaining-u.credits_topup,0)));
    return `<tr>
      <td><a data-user="${esc(u.user_id)}">${esc(u.ident)}</a>${u.is_test?' <span class="badge">test</span>':''}${anonPaid(u)?' <span class="badge" style="background:#fee2e2;color:#b91c1c">paid · anon</span>':''}</td>
      <td>${esc(u.plan_id||"—")}</td>
      <td>${esc(u.period_end||"—")}</td>
      <td>${limitStatus(u)}</td>
      <td class="r">${n(u.reqs)}</td>
      <td class="r b">${usd(u.cost_usd)}</td>
      <td class="r">${monthLeft}</td>
      <td class="r">${u.credits_topup?n(u.credits_topup):"—"}</td>
      <td class="r">${m?`${m.pct.toFixed(1)}%`:"—"}</td>
      <td>${esc(u.last_seen)}</td></tr>`;
  }).join("")}</table>
  <p class="muted">“month left” is the plan's own allowance, “top-up” the purchased credits beside it — the app only ever sees their sum. “Margin” = (price − Apple's ${Math.round(APPLE_CUT*100)}% − this window's token cost) ÷ price after Apple.</p>`;
}
function sessionsTable(rows){
  const head=st.user?`<p class="muted">Sessions for ${sid(st.user)} · <a data-user="">all users</a></p>`:"";
  if(!rows.length) return head+`<p class="muted">No sessions with a session_id yet — they populate once a TestFlight build with the new client (it stamps <code>x-aisance-session</code>) ships.</p>`;
  return head+`<table><tr><th>session</th><th>user</th><th>device</th><th class="r">turns</th><th class="r">cost</th><th>started</th><th>ended</th></tr>${rows.map(s=>`<tr><td><a data-session="${esc(s.session_id)}">${sid(s.session_id)}</a></td><td>${who(s.ident)}</td><td>${s.device_id?sid(s.device_id):"—"}</td><td class="r">${n(s.turns)}</td><td class="r b">${usd(s.cost_usd)}</td><td>${esc(s.started)}</td><td>${esc(s.ended)}</td></tr>`).join("")}</table>`;
}
// Render the CARDS a turn actually showed. A card-only turn logs the full {widgets, proposals}
// payload into output_text (claude-proxy-agent logIO), so parse it and draw each as a compact widget
// block — the dashboard then SHOWS the card the user saw, not a blank "(card response)" line. Returns
// "" when output_text isn't a card payload (a plain text turn, or a raw debug dump), so callers fall
// back to the text path.
function renderCards(outputText){
  if(!outputText) return "";
  let obj; try{ obj=JSON.parse(outputText); }catch{ return ""; }
  if(!obj||typeof obj!=="object") return "";
  const items=[
    ...(Array.isArray(obj.widgets)?obj.widgets:[]).map(w=>({kind:(w&&(w.kind||w.type))||"widget", data:(w&&(w.props||w.payload))||w})),
    ...(Array.isArray(obj.proposals)?obj.proposals:[]).map(p=>({kind:(p&&p.kind)||"proposal", data:(p&&p.payload)||p})),
  ];
  if(!items.length) return "";
  return items.map(c=>{
    const d=c.data;
    const rows=(d&&typeof d==="object"&&!Array.isArray(d))
      ? Object.entries(d).map(([k,v])=>`<div class="mwr"><span class="k">${esc(k)}</span><span class="v">${esc(typeof v==="object"?JSON.stringify(v):String(v))}</span></div>`).join("")
      : (d!=null&&String(d)!=="[object Object]"?`<div class="mwr"><span class="v">${esc(String(d))}</span></div>`:"");
    return `<div class="mwidget"><div class="mwk">▣ ${esc(c.kind)}</div>${rows}</div>`;
  }).join("");
}
function ioBlocks(io){
  if(!io||!io.length) return "";
  // Costed by the server at the price that was in effect for that model on that day (model_pricing).
  // It used to be (in*3 + out*15) right here, which quietly overcharged every Sonnet 5 turn by 1.5×
  // and would have gone stale again the moment any rate moved.
  const cost=(r)=>+r.cost_usd||0;
  return `<h3>Chat monitoring (${io.length})</h3><p class="muted">Per turn: user message, AI response, time, tokens, cost, model/mode.</p>`+io.map((r)=>{
    const um=r.user_message??r.input_text??"", ar=r.ai_response??r.output_text??"";
    // A card-only turn has no reply text. Newer rows carry a "[card response] …" summary + the card
    // payload in output_text; older rows (logged before the proxy fix) captured neither, so the
    // response is genuinely unrecoverable — label it rather than showing a blank bubble that reads
    // as "the AI said nothing".
    const cardsHtml=renderCards(r.output_text);
    const isCardResp=ar.startsWith("[card response]");
    let arCell;
    if(cardsHtml){
      // Full card payload recovered → render the card(s), with the reply text above only if it's a
      // real message (not the "[card response]" summary placeholder).
      arCell=(ar.trim()!==""&&!isCardResp?`<div style="margin-bottom:6px">${esc(ar)}</div>`:"")+cardsHtml;
    }else if(isCardResp){
      // Only the kind summary survived (payload not captured, e.g. an older row) — show the kinds as
      // badges rather than the raw "[card response] …" tag.
      const kinds=ar.replace("[card response]","").split(",").map(s=>s.trim()).filter(Boolean);
      arCell=kinds.length?kinds.map(k=>`<span class="badge">▣ ${esc(k)}</span>`).join(" "):`<span class="muted" style="font-style:italic">(card response)</span>`;
    }else{
      arCell=ar.trim()!==""?esc(ar):`<span class="muted" style="font-style:italic">(card response — no text captured for this turn)</span>`;
    }
    const dump=(r.user_message!=null&&(r.input_text||r.output_text))?`<details class="iod"><summary>full prompt + raw completion / card payload (debug)</summary><div class="iogrid"><div><div class="iol">INPUT</div><pre>${esc(r.input_text||"")}</pre></div><div><div class="iol">OUTPUT</div><pre>${esc(r.output_text||"")}</pre></div></div></details>`:"";
    return `<div class="panel" style="border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0"><div class="muted" style="font-size:12px;margin-bottom:6px"><b>${esc(r.kind||"chat")}</b> · ${esc(r.model||"—")} · in ${n(r.input_tokens)} / out ${n(r.output_tokens)} tok · ${usd6(cost(r))} · ${esc(r.ts||"")}</div><div class="chat"><div class="msg u"><div class="who">user message</div><div class="bubble">${esc(um)}</div></div><div class="msg a"><div class="who">AI response</div><div class="bubble">${arCell}</div></div></div>${dump}</div>`;
  }).join("");
}
function sessionDetail(d){
  const reqs=d.requests||[],tx=d.transcript||[];
  // Per-component costs come from admin_session_detail, priced per model per day. The `?? …` keeps
  // an un-migrated deploy readable rather than printing NaN.
  const rt=`<h3>Requests (${reqs.length})</h3><table><tr><th>ts</th><th>kind</th><th>model</th><th class="r">in $</th><th class="r">out $</th><th class="r">cache-r $</th><th class="r">cache-w $</th><th class="r">total $</th><th class="r">latency</th></tr>${reqs.map(r=>`<tr><td>${esc(r.ts)}</td><td>${esc(r.kind)}</td><td>${esc(r.model||"—")}</td><td class="r">${r.input_cost==null?"—":usd6(r.input_cost)}</td><td class="r">${r.output_cost==null?"—":usd6(r.output_cost)}</td><td class="r">${r.cache_cost==null?"—":usd6(r.cache_cost)}</td><td class="r">${r.cache_write_cost==null?"—":usd6(r.cache_write_cost)}</td><td class="r b">${r.cost_usd==null?"—":usd6(r.cost_usd)}</td><td class="r">${n(r.latency_ms)}ms</td></tr>`).join("")}</table>`;
  const t=tx.length?`<h3>Transcript (${tx.length}) — full input &amp; output</h3><div class="chat">${tx.map(m=>`<div class="msg ${m.role==='assistant'?'a':(m.role==='system'?'s':'u')}"><div class="who">${esc(m.role)}${m.widget_kind?` · <span class="badge">${esc(m.widget_kind)}</span>`:""}<span class="ts">${esc(m.created_at)}</span></div><div class="bubble">${esc(m.text)}</div></div>`).join("")}</div>`:`<h3>Transcript</h3><p class="muted">No transcript stored — captured only for allowlisted test accounts on sandbox/TestFlight builds (production stays on-device).</p>`;
  return `<p class="muted"><a data-back="1">← all sessions</a></p>`+rt+t+ioBlocks(d.io);
}

document.addEventListener("click",(e)=>{
  const t=e.target.closest("[data-v],[data-d],[data-g],[data-eval],[data-session],[data-user],[data-back]"); if(!t)return;
  if(t.dataset.v){st.view=t.dataset.v;st.session=null;if(t.dataset.v!=="sessions")st.user=null;}
  else if(t.dataset.d){st.days=+t.dataset.d;}
  else if(t.dataset.g){st.group=t.dataset.g;}
  else if(t.dataset.eval!=null){st.eval=!st.eval;}
  else if(t.dataset.session!=null){st.session=t.dataset.session;st.view="session";}
  else if(t.dataset.user!=null){st.user=t.dataset.user||null;st.view="sessions";}
  else if(t.dataset.back){st.view="sessions";st.session=null;}
  render();
});
$("go").addEventListener("click",()=>{persist();render();});
$("key").addEventListener("keydown",(e)=>{if(e.key==="Enter"){persist();render();}});
(function init(){
  const s=JSON.parse(localStorage.getItem("aisance_dash")||"{}");
  $("base").value=s.base||DEFAULT_BASE; $("key").value=s.key||"";
  if(s.key) render(); else renderControls();
})();
</script>
</body>
</html>
